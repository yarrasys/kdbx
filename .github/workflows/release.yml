name: release
on:
  push:
    tags: ["v*"]

# Least privilege at the top; the one job that publishes widens it for itself.
# Declaring write here instead would hand every future job in this file the
# ability to push commits, packages and OIDC-signed attestations, which is what
# OpenSSF Scorecard's Token-Permissions check flags.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload archives
      packages: write # push the image to ghcr.io
      id-token: write # cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: "1.25.x"}
      # cosign is pinned to the 2.x line on purpose. cosign 3 defaults to
      # --new-bundle-format=true, which deprecates and *ignores* the
      # --output-signature/--output-certificate flags in .goreleaser.yaml's
      # `signs` block — signing would appear to succeed while producing no
      # SHA256SUMS.sig/.pem, the exact artifacts SECURITY.md tells users to
      # verify. Moving to the bundle format means changing the signs block,
      # the published asset names and SECURITY.md together, and it cannot be
      # rehearsed locally (keyless signing needs the runner's OIDC token), so
      # it is a deliberate change of its own, not a dependency bump.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.4
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # HOMEBREW_TAP_TOKEN is a fine-grained PAT scoped to yarrasys/homebrew-tap
      # (Contents: read+write) — the repo's own GITHUB_TOKEN cannot push
      # cross-repo. It expires: if the cask step 403s, rotate the secret before
      # assuming the config is wrong.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
