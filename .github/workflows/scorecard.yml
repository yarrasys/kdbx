name: scorecard
on:
  # Scorecard grades branch protection, so re-run when that changes.
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"

# Read-only by default; the analysis job widens only what it needs.
permissions: read-all

jobs:
  analysis:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF so findings land in the Security tab, not just a log.
      security-events: write
      # Publish results to the OpenSSF API — this is what makes the README
      # badge resolve, and it requires an OIDC token.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard reads the repo but must never be able to write to it.
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
