name: govulncheck
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-published advisory against an unchanged dependency is
    # found without waiting for someone to open a PR.
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pin must be a supported Go release line. govulncheck@latest tracks
      # current Go, so this job is the first thing to break when the pinned line
      # leaves support (1.25.x was red for five weeks in 2026-09/10 for exactly
      # that reason). Bump it together with ci.yml, codeql.yml, release.yml,
      # release-dryrun.yml and the go directive in go.mod.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      # govulncheck reports at two levels and only fails the build on the one
      # that matters: a vulnerability kdbx actually *calls*. Module-level
      # advisories against code we merely require are reported, not fatal —
      # today that is GO-2026-5932 (golang.org/x/crypto/openpgp is unmaintained,
      # no fix exists, and nothing here imports it). Making those fatal would
      # mean a permanently red pipeline nobody can fix, which trains people to
      # ignore it.
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
