name: mcp-publish
on:
  # Dispatch-only, deliberately. A `release: published` trigger would never
  # fire here: GoReleaser creates the release with the workflow's GITHUB_TOKEN,
  # and token-created events do not trigger other workflows (GitHub's
  # recursion guard). Verified on v0.2.1: the release published and no run
  # appeared. Publishing to the registry is therefore an explicit post-release
  # step: gh workflow run mcp-publish.yml -f version=X.Y.Z
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (no v prefix, e.g. 0.2.0). Defaults to the latest release."
        required: false
        type: string

permissions:
  contents: read

# Publishes the MCP Registry entry. Split out of release.yml after v0.2.0:
# the in-release step was continue-on-error (a directory listing must not fail
# a release whose artifacts already published), which meant its first real
# failure hid behind a green tick, and retrying meant cutting a new tag. Here
# a failure is a red run on its own, and a version can be retried or
# backfilled without touching the release. The registry validates more than
# the published schema does (canonical OCI identifier, no version field, a
# server-name label baked into the image), so this workflow is the only real
# preflight.
#
# GitHub OIDC proves ownership of the io.github.yarrasys namespace — no token
# to mint or rotate, which is why this runs in Actions rather than a laptop.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: publish server.json
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' | sed 's/^v//')"
          fi
          echo "publishing version $VERSION"
          # Keep the manifest in step with the version being published. The OCI
          # identifier is canonical (image:tag); the registry rejects a
          # registryBaseUrl field.
          tmp=$(mktemp)
          jq --arg v "$VERSION" \
             '.version = $v
              | (.packages[] | select(.registryType=="oci") | .identifier) = "ghcr.io/yarrasys/kdbx:" + $v' \
             server.json > "$tmp" && mv "$tmp" server.json
          curl -sSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
