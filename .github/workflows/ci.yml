name: ci
on:
  push:
    branches: [main]
  pull_request:

# Nothing in CI writes to the repo; the default token is read-only by choice.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - run: go build ./...
      - run: go test ./... -race
      - run: go vet ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      # golangci-lint-action v8+ requires golangci-lint >= v2.1.0. The pinned
      # version is deliberate: it must match what contributors run locally
      # (AGENTS.md rule 5), so bump it here and in your toolchain together.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
