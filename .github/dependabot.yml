version: 2
updates:
  # Go modules. Grouped so the routine patch noise arrives as one PR, but the
  # KDBX engine is deliberately left ungrouped: gokeepasslib decides the on-disk
  # vault format, so its bumps get their own PR, their own re-verification
  # against keepassxc-cli, and an entry in docs/spike-notes.md.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["github.com/tobischo/gokeepasslib/v3"]
        update-types: [minor, patch]

  # GitHub Actions. Left ungrouped by design — a major bump here can change the
  # release pipeline's observable output (see the cosign pin in release.yml), and
  # release.yml is never exercised by CI, so each one wants reading on its own.
  #
  # Every action is pinned to a commit SHA with the version in a trailing comment,
  # because a tag can be repointed at new code after review. Dependabot
  # understands that form: it bumps the SHA and rewrites the comment, so the PRs
  # stay readable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
